<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Az Jailer</title>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: rgba(5, 13, 28, .92);
      --panel: #0d203d;
      --panel-2: #10294e;
      --line: rgba(137, 184, 255, .2);
      --text: #eef6ff;
      --muted: #9db8d8;
      --blue: #2f8cff;
      --blue-2: #60aaff;
      --danger: #ff5f73;
      --good: #48d597;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--text);
      background: transparent;
    }
    body.open { display: flex; }

    .shell {
      width: min(1120px, 92vw);
      height: min(760px, 88vh);
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      background: linear-gradient(90deg, #0b2d63, #0e3d86);
      border-bottom: 1px solid var(--line);
    }

    h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
    .sub { color: #c4dcff; font-size: 13px; margin-top: 3px; }
    .close {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: var(--text);
      border-radius: 6px;
      font-size: 22px;
      cursor: pointer;
    }

    main {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 0;
    }

    nav {
      padding: 16px;
      background: rgba(5, 18, 39, .72);
      border-right: 1px solid var(--line);
    }
    .tab {
      width: 100%;
      display: block;
      margin-bottom: 8px;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-weight: 700;
    }
    .tab.active {
      color: var(--text);
      background: rgba(47, 140, 255, .18);
      border-color: rgba(96, 170, 255, .35);
    }

    .content {
      min-height: 0;
      overflow: auto;
      padding: 18px;
    }
    section { display: none; }
    section.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
    }
    .card h2 {
      margin: 0 0 13px;
      font-size: 16px;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(137, 184, 255, .24);
      border-radius: 6px;
      padding: 10px 11px;
      background: #08182e;
      color: var(--text);
      outline: none;
      font: inherit;
    }
    textarea { min-height: 96px; resize: vertical; }
    .field { margin-bottom: 12px; }

    .charges {
      display: grid;
      gap: 8px;
      max-height: 315px;
      overflow: auto;
      padding-right: 4px;
    }
    .charge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid rgba(137, 184, 255, .16);
      border-radius: 6px;
      background: rgba(255,255,255,.03);
      cursor: pointer;
    }
    .charge input { width: auto; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button.primary, button.secondary, button.danger {
      border: 0;
      border-radius: 6px;
      padding: 10px 13px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      background: var(--blue);
    }
    button.secondary { background: #1c3f70; }
    button.danger { background: var(--danger); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(137, 184, 255, .14);
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .pill {
      display: inline-flex;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(47, 140, 255, .18);
      color: #bcd9ff;
      font-size: 12px;
      font-weight: 800;
    }
    .error { color: var(--danger); min-height: 20px; margin-top: 8px; }
    .empty { color: var(--muted); padding: 18px 0; }

    @media (max-width: 820px) {
      .shell { height: 92vh; }
      main { grid-template-columns: 1fr; }
      nav { display: flex; gap: 8px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .tab { white-space: nowrap; margin: 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Az Jailer Control</h1>
        <div class="sub">Sentencing, case lookup, court review, and lawyer payment</div>
      </div>
      <button class="close" id="close" title="Close">&times;</button>
    </header>

    <main>
      <nav>
        <button class="tab active" data-tab="sentence">Sentence</button>
        <button class="tab" data-tab="cases">Case Search</button>
        <button class="tab" data-tab="court">Court Docket</button>
      </nav>

      <div class="content">
        <section id="sentence" class="active">
          <div class="grid">
            <div class="card">
              <h2>Inmate</h2>
              <div class="field"><label>Player ID</label><input id="targetId" type="number" min="1"></div>
              <div class="field"><label>Minutes</label><input id="time" type="number" min="1" max="720" value="10"></div>
              <div class="field"><label>Fine</label><input id="fine" type="number" min="0" value="0"></div>
              <div class="field"><label>Notes</label><textarea id="notes" placeholder="Optional court notes"></textarea></div>
              <div class="actions"><button class="primary" id="submitJail">File Sentence</button></div>
              <div class="error" id="jailError"></div>
            </div>
            <div class="card">
              <h2>Charges</h2>
              <div id="charges" class="charges"></div>
            </div>
          </div>
        </section>

        <section id="cases">
          <div class="card">
            <h2>Case Search</h2>
            <div class="field"><label>Online Player ID</label><input id="caseUserId" type="number" min="1"></div>
            <div class="actions"><button class="primary" id="fetchCases">Search</button></div>
            <div id="caseResults" class="empty">No case search loaded.</div>
          </div>
        </section>

        <section id="court">
          <div class="card">
            <h2>Court Tools</h2>
            <div class="grid">
              <div>
                <div class="field"><label>Lawyer Player ID</label><input id="lawyerId" type="number" min="1"></div>
                <button class="secondary" id="payLawyer">Pay Lawyer</button>
              </div>
              <div>
                <div class="field"><label>Release Player ID</label><input id="releaseId" type="number" min="1"></div>
                <button class="danger" id="releasePlayer">Release Player</button>
              </div>
            </div>
          </div>
          <div class="card" style="margin-top:14px">
            <h2>Active Docket</h2>
            <div class="actions"><button class="secondary" id="refreshDocket">Refresh</button></div>
            <div id="docketResults" class="empty">No docket loaded.</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const post = (name, data = {}) => fetch(`https://${GetParentResourceName()}/${name}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify(data)
    }).then(r => r.json().catch(() => ({})));

    const body = document.body;
    const $ = id => document.getElementById(id);

    function closeUi() {
      body.classList.remove('open');
      post('close');
    }

    function selectTab(name) {
      document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === name));
      document.querySelectorAll('section').forEach(sec => sec.classList.toggle('active', sec.id === name));
      if (name === 'court') post('fetchDocket');
    }

    function renderCharges() {
      const holder = $('charges');
      holder.innerHTML = '';
      Object.entries(window.chargeCategories || {}).forEach(([category, charges]) => {
        const title = document.createElement('div');
        title.className = 'pill';
        title.textContent = category;
        holder.appendChild(title);
        charges.forEach(charge => {
          const row = document.createElement('label');
          row.className = 'charge';
          row.innerHTML = `<input type="checkbox" value="${charge.replace(/"/g, '&quot;')}"><span>${charge}</span>`;
          holder.appendChild(row);
        });
      });
    }

    function table(records, actions) {
      if (!records || !records.length) return '<div class="empty">No records found.</div>';
      const rows = records.map(r => `
        <tr>
          <td>#${r.id || '-'}</td>
          <td>${r.inmate_name || '-'}</td>
          <td>${r.time_minutes || 0}m<br><span class="pill">${r.status || 'active'}</span></td>
          <td>${r.charges || '-'}</td>
          <td>${r.notes || ''}</td>
          <td>${actions ? actions(r) : (r.fine ? `$${r.fine}` : '-')}</td>
        </tr>`).join('');
      return `<table><thead><tr><th>Case</th><th>Inmate</th><th>Sentence</th><th>Charges</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    renderCharges();
    $('close').addEventListener('click', closeUi);
    document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => selectTab(btn.dataset.tab)));

    $('submitJail').addEventListener('click', () => {
      const charges = [...document.querySelectorAll('#charges input:checked')].map(input => input.value);
      $('jailError').textContent = '';
      post('submitJail', {
        targetId: $('targetId').value,
        time: $('time').value,
        fine: $('fine').value,
        notes: $('notes').value,
        charges
      });
    });

    $('fetchCases').addEventListener('click', () => post('fetchCases', { userId: $('caseUserId').value }));
    $('refreshDocket').addEventListener('click', () => post('fetchDocket'));
    $('payLawyer').addEventListener('click', () => post('payLawyer', { targetId: $('lawyerId').value }));
    $('releasePlayer').addEventListener('click', () => post('unjailPlayer', { targetId: $('releaseId').value }));

    window.addEventListener('click', event => {
      const btn = event.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const caseId = btn.dataset.caseId;
      const payload = {};
      if (action === 'reduce') {
        const minutes = prompt('Reduce by how many minutes?', '5');
        if (!minutes) return;
        payload.minutes = Number(minutes);
      }
      if (action === 'assign_lawyer') {
        const lawyerId = prompt('Lawyer player ID?');
        if (!lawyerId) return;
        payload.lawyerId = Number(lawyerId);
      }
      post('courtAction', { caseId, action, payload });
      setTimeout(() => post('fetchDocket'), 350);
    });

    window.addEventListener('message', event => {
      const msg = event.data || {};
      if (msg.action === 'open') { body.classList.add('open'); selectTab('sentence'); }
      if (msg.action === 'openCaseSearch') { body.classList.add('open'); selectTab('cases'); }
      if (msg.action === 'close') closeUi();
      if (msg.action === 'jailError') $('jailError').textContent = msg.message || 'Unknown error';
      if (msg.action === 'caseRecords') $('caseResults').innerHTML = table(msg.records || []);
      if (msg.action === 'courtDocket') {
        $('docketResults').innerHTML = table(msg.records || [], r => `
          <button class="secondary" data-action="reduce" data-case-id="${r.id}">Reduce</button>
          <button class="secondary" data-action="assign_lawyer" data-case-id="${r.id}">Lawyer</button>
          <button class="danger" data-action="release" data-case-id="${r.id}">Release</button>
        `);
      }
    });

    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeUi();
    });
</script>
</body>
</html>
